kind = "web"
previewPath = "/"
title = "Campaign Activity Planner"
description = "A governed campaign and activity planning platform for marketing teams, with a versioned Webinar template, relative scheduling, journey and calendar views, readiness controls, approvals, audit history, and exports."
version = "1.0.0"
id = "artifacts/campaign-activity-planner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20917

[services.development]
run = "pnpm --filter @workspace/campaign-activity-planner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campaign-activity-planner", "run", "build" ]
serve = "static"
publicDir = "artifacts/campaign-activity-planner/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20917"
BASE_PATH = "/"
