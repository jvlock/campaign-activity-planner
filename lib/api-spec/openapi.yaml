openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Campaign Activity Planner API
servers:
  - url: /api
tags:
  - name: health
  - name: campaigns
  - name: planning
  - name: governance
  - name: operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [planning]
      responses:
        "200":
          description: Planning overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      responses:
        "200":
          description: Campaign plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CampaignPlan" }
    post:
      operationId: createCampaign
      tags: [campaigns]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignPlan" }
  /campaigns/{campaignId}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: getCampaign
      tags: [campaigns]
      responses:
        "200":
          description: Campaign workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignWorkspace" }
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignUpdate" }
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignPlan" }
  /campaigns/{campaignId}/governance/retry:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: retryCampaignGovernance
      tags: [governance]
      responses:
        "200":
          description: Governance assignment retried and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignPlan" }
  /campaigns/{campaignId}/workbook:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    get:
      operationId: exportImplementationWorkbook
      tags: [planning]
      responses:
        "200":
          description: Implementation workbook data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImplementationWorkbook" }
  /campaigns/{campaignId}/webinar:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    post:
      operationId: createWebinar
      tags: [planning]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebinarInput" }
      responses:
        "201":
          description: Webinar and schedule created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignWorkspace" }
  /activities/{activityId}/reschedule:
    post:
      operationId: previewReschedule
      tags: [planning]
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RescheduleInput" }
      responses:
        "200":
          description: Reschedule impact preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReschedulePreview" }
  /activities/{activityId}:
    get:
      operationId: getActivity
      tags: [planning]
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Activity detail with child communications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityDetail" }
  /activities/{activityId}/registrations:
    post:
      operationId: registerWebinarPerson
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationInput" }
      responses:
        "200":
          description: Registration recorded and recruitment suppressed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalResult" }
  /activities/{activityId}/attendance:
    post:
      operationId: recordWebinarAttendance
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceInput" }
      responses:
        "200":
          description: Attendance recorded and follow-up branch resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalResult" }
  /activities/{activityId}/confirm-reschedule:
    post:
      operationId: confirmReschedule
      tags: [planning]
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RescheduleInput" }
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignWorkspace" }
  /communications/{communicationId}:
    get:
      operationId: getCommunication
      tags: [planning]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Communication detail including registered links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationDetail" }
    patch:
      operationId: updateCommunication
      tags: [planning]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunicationUpdate" }
      responses:
        "200":
          description: Updated communication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Communication" }
  /communications/{communicationId}/readiness:
    get:
      operationId: getCommunicationReadiness
      tags: [planning]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Readiness checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResult" }
  /communications/{communicationId}/links:
    post:
      operationId: registerTrackingLink
      tags: [governance]
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackingLinkInput" }
      responses:
        "201":
          description: Governed tracking link registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingLink" }
  /company-aliases:
    get:
      operationId: listCompanyAliases
      tags: [governance]
      responses:
        "200":
          description: Company display name registry
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompanyAlias" }
    post:
      operationId: createCompanyAlias
      tags: [governance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyAliasInput" }
      responses:
        "201":
          description: Company alias created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyAlias" }
  /company-aliases/resolve:
    get:
      operationId: resolveCompanyAlias
      tags: [governance]
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolved company display name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyAliasResolution" }
  /company-aliases/{companyAliasId}:
    parameters:
      - name: companyAliasId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateCompanyAlias
      tags: [governance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyAliasUpdate" }
      responses:
        "200":
          description: Company alias updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyAlias" }
    delete:
      operationId: deleteCompanyAlias
      tags: [governance]
      responses:
        "204":
          description: Company alias deleted
  /governance/status:
    get:
      operationId: getGovernanceStatus
      tags: [governance]
      responses:
        "200":
          description: Governance provider status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceStatus" }
  /governance/taxonomy/{scope}:
    get:
      operationId: getGovernanceTaxonomy
      tags: [governance]
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Authoritative taxonomy values, or an explicitly disconnected result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceTaxonomy" }
        "503":
          description: Governance provider failed while retrieving taxonomy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceError" }
components:
  parameters:
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string }
    ActivityId:
      name: activityId
      in: path
      required: true
      schema: { type: string }
    CommunicationId:
      name: communicationId
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    GovernanceStatus:
      type: object
      required: [connected, label, authoritativeSource]
      properties:
        connected: { type: boolean }
        label: { type: string }
        authoritativeSource: { type: string }
    GovernanceTaxonomy:
      type: object
      required: [scope, taxonomyVersion, connected, values]
      properties:
        scope: { type: string }
        taxonomyVersion: { type: ["string", "null"] }
        connected: { type: boolean }
        values:
          type: array
          items: { $ref: "#/components/schemas/GovernanceTaxonomyValue" }
    GovernanceTaxonomyValue:
      type: object
      required: [stableKey, displayName, status]
      properties:
        stableKey: { type: string }
        displayName: { type: string }
        status: { type: string }
    ServiceError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    CampaignPlan:
      type: object
      required: [id, internalTitle, shortTitle, objective, lifecycleStatus, governanceStatus, owner, startDate, endDate, product, geography, businessUnit, campaignType, audienceSegment, fiscalPeriod, description, activityCount, warningCount, updatedAt, version]
      properties:
        id: { type: string }
        internalTitle: { type: string }
        shortTitle: { type: string }
        objective: { type: string }
        lifecycleStatus: { type: string }
        governanceStatus: { type: string }
        governanceRecordId: { type: ["string", "null"] }
        campaignCode: { type: ["string", "null"] }
        owner: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        product: { type: string }
        geography: { type: string }
        businessUnit: { type: string }
        campaignType: { type: string }
        audienceSegment: { type: string }
        fiscalPeriod: { type: string }
        description: { type: string }
        activityCount: { type: number }
        warningCount: { type: number }
        updatedAt: { type: string, format: date-time }
        version: { type: number }
    CampaignInput:
      type: object
      required: [shortTitle, objective, owner, startDate, endDate, product, geography, businessUnit]
      properties:
        shortTitle: { type: string, minLength: 2 }
        objective: { type: string, minLength: 2 }
        owner: { type: string, minLength: 2 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        product: { type: string, minLength: 1 }
        geography: { type: string, minLength: 1 }
        businessUnit: { type: string, minLength: 1 }
        campaignType: { type: string, minLength: 1 }
        audienceSegment: { type: string, minLength: 1 }
        fiscalPeriod: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
    CampaignUpdate:
      type: object
      properties:
        shortTitle: { type: string }
        objective: { type: string }
        owner: { type: string }
        lifecycleStatus: { type: string }
        product: { type: string }
        geography: { type: string }
        businessUnit: { type: string }
        campaignType: { type: string }
        audienceSegment: { type: string }
        fiscalPeriod: { type: string }
        description: { type: string }
    WebinarInput:
      type: object
      required: [subject, externalTitle, segment, geography, language, product, topic, objective, eventDate, startTime, durationMinutes, timezone, platform]
      properties:
        subject: { type: string }
        externalTitle: { type: string }
        segment: { type: string }
        geography: { type: string }
        language: { type: string }
        product: { type: string }
        topic: { type: string }
        objective: { type: string }
        successMeasure: { type: string }
        eventDate: { type: string, format: date }
        startTime: { type: string }
        durationMinutes: { type: number }
        timezone: { type: string }
        platform: { type: string }
        registrationUrl: { type: string }
        subsegment: { type: string }
        persona: { type: string }
        customerStatus: { type: string }
        exclusions:
          type: array
          items: { type: string }
        speakers:
          type: array
          items: { $ref: "#/components/schemas/WebinarSpeakerInput" }
        scheduleOptions: { $ref: "#/components/schemas/WebinarScheduleOptions" }
        registrationPending: { type: boolean }
        webinarOwner: { type: string, minLength: 1 }
        emailMarketingOwner: { type: string, minLength: 1 }
    WebinarSpeakerInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        title: { type: string }
        organization: { type: string }
        bio: { type: string }
    WebinarScheduleOptions:
      type: object
      properties:
        includeStartNotification: { type: boolean, default: false }
        includeRecordingReminder: { type: boolean, default: true }
    CampaignActivity:
      type: object
      required: [id, campaignId, activityType, internalTitle, shortTitle, lifecycleStatus, governanceStatus, eventDate, startTime, timezone, owner, version]
      properties:
        id: { type: string }
        campaignId: { type: string }
        activityType: { type: string }
        internalTitle: { type: string }
        shortTitle: { type: string }
        lifecycleStatus: { type: string }
        governanceStatus: { type: string }
        eventDate: { type: string, format: date }
        startTime: { type: string }
        timezone: { type: string }
        owner: { type: string }
        activityCode: { type: ["string", "null"] }
        version: { type: number }
    Communication:
      type: object
      required: [id, activityId, internalTitle, shortTitle, communicationType, channel, audienceBranch, relativeRule, originalDate, scheduledDate, sendTime, timezone, lifecycleStatus, approvalStatus, warningCount, pinned, sent]
      properties:
        id: { type: string }
        activityId: { type: string }
        internalTitle: { type: string }
        shortTitle: { type: string }
        communicationType: { type: string }
        channel: { type: string }
        audienceBranch: { type: string }
        relativeRule: { type: string }
        originalDate: { type: string, format: date }
        scheduledDate: { type: string, format: date }
        sendTime: { type: string }
        timezone: { type: string }
        adjustmentReason: { type: ["string", "null"] }
        lifecycleStatus: { type: string }
        approvalStatus: { type: string }
        warningCount: { type: number }
        pinned: { type: boolean }
        sent: { type: boolean }
        subject: { type: ["string", "null"] }
        preheader: { type: ["string", "null"] }
        body: { type: ["string", "null"] }
        destinationUrl: { type: ["string", "null"] }
        header: { type: ["string", "null"] }
        primaryCtaLabel: { type: ["string", "null"] }
        destinationType: { type: ["string", "null"] }
        secondaryCtaLabel: { type: ["string", "null"] }
        secondaryCtaUrl: { type: ["string", "null"] }
        fromName: { type: ["string", "null"] }
        replyTo: { type: ["string", "null"] }
        dynamicTokens: { type: array, items: { type: string } }
        tokenFallbacks: { type: object, additionalProperties: { type: string } }
        communicationCode: { type: ["string", "null"] }
        utmParameters: { type: object, additionalProperties: { type: string } }
        owner: { type: string }
        dependencies: { type: array, items: { type: string } }
        qaChecklist: { type: object, additionalProperties: { type: boolean } }
        version: { type: number }
    CommunicationUpdate:
      type: object
      properties:
        shortTitle: { type: string }
        subject: { type: string }
        preheader: { type: string }
        body: { type: string }
        destinationUrl: { type: string }
        lifecycleStatus: { type: string }
        approvalStatus: { type: string }
        pinned: { type: boolean }
        header: { type: string }
        primaryCtaLabel: { type: string }
        destinationType: { type: string }
        secondaryCtaLabel: { type: string }
        secondaryCtaUrl: { type: string }
        fromName: { type: string }
        replyTo: { type: string }
        dynamicTokens: { type: array, items: { type: string } }
        tokenFallbacks: { type: object, additionalProperties: { type: string } }
        communicationCode: { type: string }
        utmParameters: { type: object, additionalProperties: { type: string } }
        owner: { type: string }
        dependencies: { type: array, items: { type: string } }
        qaChecklist: { type: object, additionalProperties: { type: boolean } }
    ChangeEvent:
      type: object
      required: [id, eventType, summary, actor, createdAt]
      properties:
        id: { type: string }
        eventType: { type: string }
        summary: { type: string }
        actor: { type: string }
        createdAt: { type: string, format: date-time }
    CampaignWorkspace:
      type: object
      required: [campaign, activities, communications, changeEvents]
      properties:
        campaign: { $ref: "#/components/schemas/CampaignPlan" }
        activities:
          type: array
          items: { $ref: "#/components/schemas/CampaignActivity" }
        communications:
          type: array
          items: { $ref: "#/components/schemas/Communication" }
        changeEvents:
          type: array
          items: { $ref: "#/components/schemas/ChangeEvent" }
    Dashboard:
      type: object
      required: [activeCampaigns, upcomingActivities, communicationsInReview, blockingWarnings, campaigns, upcomingCommunications]
      properties:
        activeCampaigns: { type: number }
        upcomingActivities: { type: number }
        communicationsInReview: { type: number }
        blockingWarnings: { type: number }
        campaigns:
          type: array
          items: { $ref: "#/components/schemas/CampaignPlan" }
        upcomingCommunications:
          type: array
          items: { $ref: "#/components/schemas/Communication" }
    RescheduleInput:
      type: object
      required: [eventDate]
      properties:
        eventDate: { type: string, format: date }
        startTime: { type: string }
        timezone: { type: string }
    RescheduleItem:
      type: object
      required: [communicationId, title, oldDate, proposedDate, action, warning]
      properties:
        communicationId: { type: string }
        title: { type: string }
        oldDate: { type: string, format: date }
        proposedDate: { type: string, format: date }
        action: { type: string }
        warning: { type: boolean }
    ReschedulePreview:
      type: object
      required: [oldEventDate, newEventDate, items, warnings]
      properties:
        oldEventDate: { type: string, format: date }
        newEventDate: { type: string, format: date }
        oldStartTime: { type: ["string", "null"] }
        newStartTime: { type: ["string", "null"] }
        oldTimezone: { type: ["string", "null"] }
        newTimezone: { type: ["string", "null"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/RescheduleItem" }
        warnings:
          type: array
          items: { type: string }
    ReadinessCheck:
      type: object
      required: [key, label, passed, blocking]
      properties:
        key: { type: string }
        label: { type: string }
        passed: { type: boolean }
        blocking: { type: boolean }
    ReadinessResult:
      type: object
      required: [ready, checks]
      properties:
        ready: { type: boolean }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ReadinessCheck" }
    ActivityDetail:
      type: object
      required: [activity, communications]
      properties:
        activity: { $ref: "#/components/schemas/CampaignActivity" }
        communications:
          type: array
          items: { $ref: "#/components/schemas/Communication" }
    CommunicationDetail:
      type: object
      required: [communication, links, contentHistory]
      properties:
        communication: { $ref: "#/components/schemas/Communication" }
        links:
          type: array
          items: { $ref: "#/components/schemas/TrackingLink" }
        contentHistory:
          type: array
          items: { $ref: "#/components/schemas/ContentVersion" }
    ContentVersion:
      type: object
      required: [id, versionNumber, isCurrent, createdAt]
      properties:
        id: { type: string }
        versionNumber: { type: number }
        subject: { type: ["string", "null"] }
        header: { type: ["string", "null"] }
        body: { type: ["string", "null"] }
        primaryCtaLabel: { type: ["string", "null"] }
        secondaryCtaLabel: { type: ["string", "null"] }
        secondaryCtaUrl: { type: ["string", "null"] }
        fromName: { type: ["string", "null"] }
        replyTo: { type: ["string", "null"] }
        tokenFallbacks: { type: object, additionalProperties: { type: string } }
        isCurrent: { type: boolean }
        createdAt: { type: string, format: date-time }
    RegistrationInput:
      type: object
      required: [personReference]
      properties:
        personReference: { type: string, minLength: 1 }
    AttendanceInput:
      type: object
      required: [personReference, attendanceStatus]
      properties:
        personReference: { type: string, minLength: 1 }
        attendanceStatus: { type: string, enum: [Attended, No Show] }
        attendedMinutes: { type: number, minimum: 0 }
        explicitHandraiser: { type: boolean }
    OperationalResult:
      type: object
      required: [personReference, branch, suppressedCommunicationIds, suppressionStates]
      properties:
        personReference: { type: string }
        branch: { type: string }
        suppressedCommunicationIds:
          type: array
          items: { type: string }
        suppressionStates:
          type: array
          items: { $ref: "#/components/schemas/PersonCommunicationState" }
    PersonCommunicationState:
      type: object
      required: [communicationId, eligibilityStatus, reason, updatedAt]
      properties:
        communicationId: { type: string }
        eligibilityStatus: { type: string, enum: [Eligible, Suppressed] }
        reason: { type: string }
        updatedAt: { type: string, format: date-time }
    TrackingLinkInput:
      type: object
      required: [baseUrl]
      properties:
        baseUrl: { type: string, minLength: 1 }
        parameters:
          type: object
          additionalProperties: { type: string }
    TrackingLink:
      type: object
      required: [id, communicationId, baseUrl, finalTrackedUrl, parameters, validationResult]
      properties:
        id: { type: string }
        communicationId: { type: string }
        baseUrl: { type: string }
        finalTrackedUrl: { type: string }
        parameters: { type: object, additionalProperties: true }
        validationResult: { type: object, additionalProperties: true }
    CompanyAlias:
      type: object
      required: [id, salesforceAccountId, legalName, normalizedMatchingName, aliases, language, approvalStatus]
      properties:
        id: { type: string }
        salesforceAccountId: { type: string }
        legalName: { type: string }
        normalizedMatchingName: { type: string }
        approvedDisplayName: { type: ["string", "null"] }
        aliases: { type: array, items: { type: string } }
        language: { type: string }
        approvalStatus: { type: string }
    CompanyAliasInput:
      type: object
      required: [salesforceAccountId, legalName]
      properties:
        salesforceAccountId: { type: string }
        legalName: { type: string }
        approvedDisplayName: { type: string }
        aliases: { type: array, items: { type: string } }
        language: { type: string }
    CompanyAliasUpdate:
      type: object
      properties:
        legalName: { type: string }
        approvedDisplayName: { type: string }
        aliases: { type: array, items: { type: string } }
        language: { type: string }
        approvalStatus: { type: string }
    CompanyAliasResolution:
      type: object
      required: [matched, query, displayName]
      properties:
        matched: { type: boolean }
